<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070914">
<title>QR Generator | NOVEX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070914;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
header{padding:22px 7%;display:flex;justify-content:space-between;border-bottom:1px solid #252943}
.logo{font-size:25px;font-weight:900;color:white;text-decoration:none;letter-spacing:3px}
.logo span{color:#00d9ff}
.back{color:#00d9ff;text-decoration:none}
.hero{text-align:center;padding:55px 20px 30px;background:radial-gradient(circle at top,#29205c,transparent 70%)}
.hero small{color:#00d9ff;letter-spacing:4px}
h1{font-size:clamp(35px,7vw,60px);margin:18px 0}
h1 span{color:#00d9ff}
.hero p{color:#a0a8c0;line-height:1.7}
.workspace{width:min(650px,90%);margin:30px auto 80px;background:#11172b;padding:28px;border:1px solid #292e50;border-radius:18px}
label{display:block;margin:15px 0 9px;color:#c6cbe0;font-size:13px}
input,select{width:100%;padding:15px;background:#080d1b;color:white;border:1px solid #343b5c;border-radius:9px;outline:none}
input:focus,select:focus{border-color:#00d9ff}
button{width:100%;padding:15px;margin-top:18px;border:0;border-radius:9px;background:linear-gradient(100deg,#7165ff,#168dff);color:white;font-weight:bold;font-size:14px;cursor:pointer}
button:active{transform:scale(.98)}
.result{margin-top:25px;text-align:center;display:none}
.result img{width:220px;height:220px;background:white;padding:10px;border-radius:12px;max-width:100%}
.result p{color:#00d9ff;margin:15px}
.download{display:inline-block;background:#17213c;color:#00d9ff;padding:13px 20px;border-radius:8px;text-decoration:none;margin-top:5px}
.note{color:#9299b5;font-size:12px;text-align:center;margin-top:20px;line-height:1.6}
footer{text-align:center;padding:25px;color:#9299b5;border-top:1px solid #252943;font-size:12px}
</style>
</head>
<body>
<header>
<a href="index.html" class="logo">NOVEX<span>.</span></a>
<a href="tools.html" class="back">← Digital Tools</a>
</header>

<section class="hero">
<small>NOVEX DIGITAL WORKSPACE</small>
<h1>QR CODE <span>GENERATOR.</span></h1>
<p>Turn your links and text into scannable QR codes in seconds.</p>
</section>

<main class="workspace">
<label for="qrText">Enter text or website URL</label>
<input id="qrText" type="text" placeholder="https://example.com">

<label for="qrSize">QR Code Size</label>
<select id="qrSize">
<option value="200">200 × 200</option>
<option value="300" selected>300 × 300</option>
<option value="500">500 × 500</option>
</select>

<button onclick="generateQR()">GENERATE QR CODE</button>

<div class="result" id="result">
<p>Your QR Code is ready!</p>
<img id="qrImage" alt="Generated QR Code">
<br>
<a id="downloadLink" class="download" download="NOVEX-QR.png">DOWNLOAD QR CODE</a>
</div>

<p class="note">Your QR code is generated using an online QR service. Internet access is required.</p>
</main>

<footer>NOVEX QR GENERATOR · © 2026 NOVEX</footer>

<script>
function generateQR(){
 const text=document.getElementById("qrText").value.trim();
 const size=document.getElementById("qrSize").value;
 const result=document.getElementById("result");
 const image=document.getElementById("qrImage");
 const download=document.getElementById("downloadLink");

 if(!text){
   alert("Please enter some text or a website URL.");
   return;
 }

 const url="https://api.qrserver.com/v1/create-qr-code/?size="+size+"x"+size+"&data="+encodeURIComponent(text);

 image.src=url;
 download.href=url;
 result.style.display="block";
}
</script>
</body>
</html>
