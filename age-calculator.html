<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator | NOVEX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070914;color:white;font-family:Arial,sans-serif;min-height:100vh}
header{padding:22px 7%;display:flex;justify-content:space-between;border-bottom:1px solid #252943}
.logo{color:white;text-decoration:none;font-size:25px;font-weight:900;letter-spacing:3px}
.logo span{color:#00d9ff}
.back{color:#00d9ff;text-decoration:none}
.hero{text-align:center;padding:50px 15px;background:radial-gradient(circle at top,#29205c,transparent 75%)}
.hero small{color:#00d9ff;letter-spacing:4px}
h1{font-size:clamp(35px,7vw,55px);margin:18px 0}
h1 span{color:#00d9ff}
.hero p{color:#a0a8c0;line-height:1.7}
.workspace{width:min(600px,90%);margin:30px auto 80px;padding:25px;background:#11172b;border:1px solid #292e50;border-radius:18px}
label{display:block;margin:15px 0 9px;color:#c6cbe0;font-size:13px}
input{width:100%;padding:15px;background:#080d1b;color:white;border:1px solid #343b5c;border-radius:9px;color-scheme:dark}
button{width:100%;padding:16px;margin-top:20px;background:linear-gradient(100deg,#7165ff,#168dff);color:white;border:0;border-radius:9px;font-weight:bold;cursor:pointer}
.result{display:none;margin-top:25px}
.result-card{background:#080d1b;border:1px solid #343b5c;padding:20px;border-radius:12px;margin-top:12px;text-align:center}
.result-card small{color:#9299b5}
.result-card strong{display:block;color:#00d9ff;font-size:24px;margin-top:10px}
.error{color:#ff8292;text-align:center;margin-top:15px;font-size:13px}
footer{text-align:center;padding:25px;color:#9299b5;border-top:1px solid #252943;font-size:12px}
</style>
</head>
<body>
<header>
<a href="index.html" class="logo">NOVEX<span>.</span></a>
<a href="tools.html" class="back">← Digital Tools</a>
</header>

<section class="hero">
<small>NOVEX DIGITAL WORKSPACE</small>
<h1>AGE <span>CALCULATOR.</span></h1>
<p>Discover your exact age and your next birthday countdown.</p>
</section>

<main class="workspace">
<label for="birthDate">Select your date of birth</label>
<input type="date" id="birthDate">
<button onclick="calculateAge()">CALCULATE MY AGE</button>
<div class="error" id="error"></div>
<section class="result" id="result">
<div class="result-card">
<small>YOUR EXACT AGE</small>
<strong id="age">—</strong>
</div>
<div class="result-card">
<small>TOTAL DAYS LIVED</small>
<strong id="days">—</strong>
</div>
<div class="result-card">
<small>NEXT BIRTHDAY</small>
<strong id="birthday">—</strong>
</div>
</section>
</main>

<footer>NOVEX AGE CALCULATOR · © 2026 NOVEX</footer>

<script>
function calculateAge(){
 const value=document.getElementById("birthDate").value;
 const error=document.getElementById("error");
 const result=document.getElementById("result");
 error.textContent="";
 result.style.display="none";

 if(!value){error.textContent="Please select your date of birth.";return;}

 const [year,month,day]=value.split("-").map(Number);
 const birth=new Date(year,month-1,day);
 const today=new Date();
 today.setHours(0,0,0,0);

 if(birth>today){error.textContent="Your birth date cannot be in the future.";return;}

 let years=today.getFullYear()-year;
 let months=today.getMonth()-(month-1);
 let days=today.getDate()-day;

 if(days<0){
  months--;
  const previousMonthDays=new Date(today.getFullYear(),today.getMonth(),0).getDate();
  days+=previousMonthDays;
 }
 if(months<0){years--;months+=12;}

 const totalDays=Math.floor((today-birth)/86400000);

 let nextYear=today.getFullYear();
 let nextBirthday=new Date(nextYear,month-1,day);
 if(nextBirthday<=today){
  nextYear++;
  nextBirthday=new Date(nextYear,month-1,day);
 }

 const countdown=Math.ceil((nextBirthday-today)/86400000);

 document.getElementById("age").textContent=
 years+" years, "+months+" months, "+days+" days";
 document.getElementById("days").textContent=totalDays.toLocaleString()+" days";
 document.getElementById("birthday").textContent=
 countdown===0?"Today!":countdown+" days remaining";

 result.style.display="block";
}
</script>
</body>
</html>
