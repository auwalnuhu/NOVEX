<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVEX | Currency Converter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#080d1c;color:#fff;min-height:100vh;padding:25px}
.container{max-width:850px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:45px}
.logo{font-size:25px;font-weight:900;color:#35d9ff}
.back{color:#35d9ff;text-decoration:none}
.hero{text-align:center;margin-bottom:30px}
.hero h1{font-size:34px;margin-bottom:12px}
.hero p{color:#aab5ca;line-height:1.6}
.converter{background:#111a30;border:1px solid #263957;border-radius:20px;padding:25px;max-width:650px;margin:auto;box-shadow:0 15px 50px #0005}
label{display:block;color:#b9c8dc;font-size:14px;margin-bottom:9px}
input,select{width:100%;padding:15px;background:#080f20;border:1px solid #304363;border-radius:10px;color:white;font-size:16px;outline:none}
input:focus,select:focus{border-color:#35d9ff}
.amount{margin-bottom:22px}
.currencies{display:grid;grid-template-columns:1fr 55px 1fr;gap:12px;align-items:end}
.swap{height:49px;border:0;border-radius:10px;background:#183e58;color:#35d9ff;font-size:23px;cursor:pointer}
.result{margin-top:25px;padding:22px;background:#081426;border:1px solid #24415f;border-radius:14px;text-align:center}
.result small{color:#aab5ca}
.result h2{font-size:30px;color:#35d9ff;margin:12px 0;overflow-wrap:anywhere}
.result p{color:#b9c8dc;font-size:14px}
button.convert{width:100%;margin-top:20px;padding:16px;background:linear-gradient(90deg,#087eae,#6247d8);color:white;border:0;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.status{text-align:center;color:#aab5ca;font-size:13px;margin-top:16px;line-height:1.5}
footer{text-align:center;color:#72819b;margin-top:35px;font-size:13px}
@media(max-width:500px){body{padding:18px}.hero h1{font-size:28px}.converter{padding:18px}.currencies{grid-template-columns:1fr 42px 1fr;gap:7px}input,select{padding:12px;font-size:14px}.result h2{font-size:25px}}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo">NOVEX.</div>
<a class="back" href="tools.html">← All Tools</a>
</header>

<section class="hero">
<h1>Currency Converter</h1>
<p>Convert currencies using the latest available exchange-rate data.</p>
</section>

<main class="converter">
<div class="amount">
<label for="amount">Amount to convert</label>
<input id="amount" type="number" min="0" step="any" value="1" placeholder="Enter amount">
</div>

<div class="currencies">
<div>
<label for="from">From</label>
<select id="from"><option value="USD">USD — US Dollar</option></select>
</div>
<button class="swap" id="swap" type="button" title="Swap currencies">⇄</button>
<div>
<label for="to">To</label>
<select id="to"><option value="NGN">NGN — Nigerian Naira</option></select>
</div>
</div>

<div class="result">
<small>Converted amount</small>
<h2 id="result">Loading rates...</h2>
<p id="rate">Preparing currency data...</p>
</div>

<button class="convert" id="convert">Convert Currency</button>
<p class="status" id="status">Connecting to exchange-rate service...</p>
</main>

<footer>© 2026 NOVEX — Your Digital Universe</footer>
</div>

<script>
const amountInput = document.getElementById("amount");
const fromSelect = document.getElementById("from");
const toSelect = document.getElementById("to");
const resultText = document.getElementById("result");
const rateText = document.getElementById("rate");
const statusText = document.getElementById("status");
const convertButton = document.getElementById("convert");

let rates = {};
let currentBase = "";
let lastUpdated = "";

async function loadRates(base) {
    if (rates[base]) return rates[base];

    statusText.textContent = "Fetching live exchange rates...";
    convertButton.disabled = true;

    try {
        const response = await fetch(
            "https://open.er-api.com/v6/latest/" + encodeURIComponent(base)
        );

        if (!response.ok) throw new Error("Network error");

        const data = await response.json();

        if (data.result !== "success") {
            throw new Error("Exchange-rate service unavailable");
        }

        rates[base] = data.rates;
        lastUpdated = data.time_last_update_utc || "Recently";
        populateCurrencies(data.rates);

        return data.rates;
    } catch (error) {
        statusText.textContent = "Could not load rates. Check your internet and try again.";
        throw error;
    } finally {
        convertButton.disabled = false;
    }
}

function populateCurrencies(rateData) {
    const currencies = Object.keys(rateData).sort();

    [fromSelect, toSelect].forEach(select => {
        const previous = select.value;
        select.innerHTML = "";

        currencies.forEach(code => {
            const option = document.createElement("option");
            option.value = code;
            option.textContent = code;
            select.appendChild(option);
        });

        if (currencies.includes(previous)) {
            select.value = previous;
        }
    });
}

function formatMoney(value, currency) {
    try {
        return new Intl.NumberFormat("en", {
            style: "currency",
            currency: currency,
            maximumFractionDigits: 4
        }).format(value);
    } catch {
        return value.toLocaleString() + " " + currency;
    }
}

async function convertCurrency() {
    const amount = Number(amountInput.value);
    const from = fromSelect.value;
    const to = toSelect.value;

    if (!Number.isFinite(amount) || amount < 0) {
        resultText.textContent = "Enter a valid amount";
        return;
    }

    try {
        const data = await loadRates(from);
        const exchangeRate = data[to];

        if (typeof exchangeRate !== "number") {
            throw new Error("Rate unavailable");
        }

        const converted = amount * exchangeRate;

        resultText.textContent = formatMoney(converted, to);
        rateText.textContent =
            "1 " + from + " = " + exchangeRate.toFixed(6) + " " + to;

        statusText.textContent = "Rate data last updated: " + lastUpdated;
        currentBase = from;
    } catch {
        resultText.textContent = "Conversion unavailable";
        rateText.textContent = "Please try again later.";
    }
}

convertButton.addEventListener("click", convertCurrency);

document.getElementById("swap").addEventListener("click", () => {
    const previousFrom = fromSelect.value;
    fromSelect.value = toSelect.value;
    toSelect.value = previousFrom;
    convertCurrency();
});

amountInput.addEventListener("input", convertCurrency);
fromSelect.addEventListener("change", convertCurrency);
toSelect.addEventListener("change", convertCurrency);

convertCurrency();
</script>
</body>
</html>
