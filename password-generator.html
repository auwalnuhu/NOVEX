<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator | NOVEX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070914;color:white;font-family:Arial,sans-serif;min-height:100vh}
header{padding:22px 7%;display:flex;justify-content:space-between;border-bottom:1px solid #252943}
.logo{color:white;text-decoration:none;font-size:25px;font-weight:900;letter-spacing:3px}
.logo span{color:#00d9ff}
.back{color:#00d9ff;text-decoration:none}
.hero{text-align:center;padding:50px 15px;background:radial-gradient(circle at top,#29205c,transparent 75%)}
.hero small{color:#00d9ff;letter-spacing:4px}
h1{font-size:clamp(34px,7vw,55px);margin:18px 0}
h1 span{color:#00d9ff}
.hero p{color:#a0a8c0}
.workspace{width:min(550px,90%);margin:30px auto 80px;padding:25px;background:#11172b;border:1px solid #292e50;border-radius:18px}
.output{display:flex;gap:8px}
.output input{flex:1;min-width:0;background:#080d1b;color:#00d9ff;padding:15px;border:1px solid #343b5c;border-radius:9px;font-size:16px}
button{padding:13px;background:#20264b;color:#00d9ff;border:1px solid #343b5c;border-radius:8px;font-weight:bold;cursor:pointer}
.generate{width:100%;margin-top:20px;padding:16px;background:linear-gradient(100deg,#7165ff,#168dff);color:white;border:0}
label{display:flex;align-items:center;gap:10px;margin:17px 0;color:#c6cbe0;font-size:14px}
label input{accent-color:#00d9ff}
.length{display:flex;justify-content:space-between;margin:22px 0 10px;color:#c6cbe0}
input[type=range]{width:100%;accent-color:#00d9ff}
#strength{margin-top:18px;color:#00d9ff;text-align:center;font-size:13px}
#message{text-align:center;color:#00d9ff;font-size:12px;margin-top:15px}
footer{text-align:center;padding:25px;color:#9299b5;border-top:1px solid #252943;font-size:12px}
</style>
</head>
<body>
<header>
<a href="index.html" class="logo">NOVEX<span>.</span></a>
<a href="tools.html" class="back">← Digital Tools</a>
</header>
<section class="hero">
<small>NOVEX DIGITAL WORKSPACE</small>
<h1>PASSWORD <span>GENERATOR.</span></h1>
<p>Create random passwords for your accounts.</p>
</section>
<main class="workspace">
<div class="output">
<input id="password" readonly placeholder="Your password appears here">
<button onclick="copyPassword()">COPY</button>
</div>
<div class="length">
<span>Password Length</span>
<strong id="lengthValue">16</strong>
</div>
<input type="range" id="length" min="8" max="64" value="16" oninput="lengthValue.textContent=this.value">
<label><input type="checkbox" id="upper" checked> Uppercase letters (A-Z)</label>
<label><input type="checkbox" id="lower" checked> Lowercase letters (a-z)</label>
<label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
<label><input type="checkbox" id="symbols" checked> Symbols (!@#$...)</label>
<button class="generate" onclick="generatePassword()">GENERATE PASSWORD</button>
<div id="strength">Choose your settings and generate a password.</div>
<div id="message"></div>
</main>
<footer>NOVEX PASSWORD GENERATOR · © 2026 NOVEX</footer>
<script>
function randomIndex(max){
 const values=new Uint32Array(1);
 crypto.getRandomValues(values);
 return values[0]%max;
}
function generatePassword(){
 const groups=[];
 if(document.getElementById("upper").checked)groups.push("ABCDEFGHIJKLMNOPQRSTUVWXYZ");
 if(document.getElementById("lower").checked)groups.push("abcdefghijklmnopqrstuvwxyz");
 if(document.getElementById("numbers").checked)groups.push("0123456789");
 if(document.getElementById("symbols").checked)groups.push("!@#$%^&*()-_=+[]{}?");
 if(!groups.length){alert("Select at least one character type.");return;}
 const length=Number(document.getElementById("length").value);
 let chars=groups.map(group=>group[randomIndex(group.length)]);
 const all=groups.join("");
 while(chars.length<length)chars.push(all[randomIndex(all.length)]);
 for(let i=chars.length-1;i>0;i--){
  const j=randomIndex(i+1);
  [chars[i],chars[j]]=[chars[j],chars[i]];
 }
 document.getElementById("password").value=chars.join("");
 document.getElementById("strength").textContent="Random password generated. Store it securely.";
 document.getElementById("message").textContent="";
}
async function copyPassword(){
 const value=document.getElementById("password").value;
 if(!value){document.getElementById("message").textContent="Generate a password first.";return;}
 try{
  await navigator.clipboard.writeText(value);
  document.getElementById("message").textContent="Password copied!";
 }catch(e){
  const input=document.getElementById("password");
  input.select();
  document.getElementById("message").textContent="Select and copy the password manually.";
 }
}
</script>
</body>
</html>
