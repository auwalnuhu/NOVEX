<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVEX | Account Access</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#080d1c;color:white;min-height:100vh;display:grid;place-items:center;padding:20px}
.container{width:100%;max-width:440px}
.logo{text-align:center;font-size:34px;font-weight:900;color:#35d9ff;margin-bottom:8px}
.logo span{color:white}
.subtitle{text-align:center;color:#9baac1;font-size:13px;margin-bottom:28px}
.card{background:#111a30;border:1px solid #263957;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0006}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#080f20;padding:5px;border-radius:10px;margin-bottom:25px}
.tabs button{background:none;border:0;color:#9baac1;padding:12px;border-radius:8px;cursor:pointer}
.tabs button.active{background:#173a56;color:#35d9ff}
h2{font-size:23px;margin-bottom:8px}
.description{font-size:13px;color:#9baac1;margin-bottom:23px;line-height:1.5}
label{display:block;font-size:13px;color:#c5d0e0;margin:16px 0 8px}
input{width:100%;padding:14px;background:#080f20;border:1px solid #304363;border-radius:9px;color:white;outline:none}
input:focus{border-color:#35d9ff}
.password-wrap{position:relative}
.password-wrap input{padding-right:65px}
.show{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:#35d9ff;cursor:pointer;font-size:12px}
.primary{width:100%;padding:15px;border:0;border-radius:9px;background:linear-gradient(90deg,#087eae,#6247d8);color:white;font-weight:bold;margin-top:22px;cursor:pointer}
.primary:disabled{opacity:.6;cursor:wait}
.extra{text-align:center;font-size:13px;color:#9baac1;margin-top:19px}
.extra button{background:none;border:0;color:#35d9ff;cursor:pointer}
.message{display:none;margin-top:17px;padding:12px;border-radius:9px;font-size:13px;line-height:1.5;background:#142b46;color:#bfefff;overflow-wrap:anywhere}
.message.error{background:#421d2b;color:#ffb5c0}
.back{text-align:center;margin-top:25px;font-size:13px}
.back a{color:#35d9ff;text-decoration:none}
.hidden{display:none}
footer{text-align:center;color:#61718b;font-size:11px;margin-top:25px}
</style>
</head>
<body>
<main class="container">
<div class="logo">NOVEX<span>.</span></div>
<p class="subtitle">Your Digital Universe</p>

<section class="card">
<div class="tabs" id="tabs">
<button class="active" id="loginTab" type="button">Login</button>
<button id="signupTab" type="button">Create Account</button>
</div>

<h2 id="heading">Welcome back</h2>
<p class="description" id="description">Sign in to continue to your NOVEX workspace.</p>

<form id="authForm">
<div id="nameGroup" class="hidden">
<label for="name">Full name</label>
<input id="name" type="text" placeholder="Enter your name" autocomplete="name">
</div>

<label for="email">Email address</label>
<input id="email" type="email" placeholder="you@example.com" required autocomplete="email">

<div id="passwordGroup">
<label for="password">Password</label>
<div class="password-wrap">
<input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
<button class="show" type="button" id="showPassword">Show</button>
</div>
</div>

<div id="confirmGroup" class="hidden">
<label for="confirmPassword">Confirm password</label>
<input id="confirmPassword" type="password" placeholder="Confirm your password" autocomplete="new-password">
</div>

<button class="primary" id="submitButton" type="submit">Login to NOVEX</button>
</form>

<div class="extra" id="forgot">
<button type="button" id="forgotButton">Forgot your password?</button>
</div>

<div class="extra hidden" id="backToLogin">
<button type="button" id="returnButton">← Back to login</button>
</div>

<div class="message" id="message" role="status"></div>
</section>

<div class="back"><a href="index.html">← Return to NOVEX Home</a></div>
<footer>SECURE ACCOUNT ACCESS · NOVEX 2026</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>

<script>
const client = window.supabaseClient;

const $ = id => document.getElementById(id);

let mode = "login";
let recoveryMode = false;

function showMessage(text,error=false){
    $("message").textContent = text;
    $("message").className = "message" + (error ? " error" : "");
    $("message").style.display = "block";
}

function hideMessage(){
    $("message").style.display = "none";
}

function setLoading(loading,text){
    $("submitButton").disabled = loading;
    $("submitButton").textContent = loading ? "Please wait..." : text;
}

function setMode(newMode){
    mode = newMode;
    recoveryMode = false;
    hideMessage();

    $("authForm").classList.remove("hidden");
    $("tabs").classList.remove("hidden");
    $("backToLogin").classList.add("hidden");
    $("passwordGroup").classList.remove("hidden");
    $("confirmGroup").classList.toggle("hidden",newMode !== "signup");
    $("nameGroup").classList.toggle("hidden",newMode !== "signup");
    $("forgot").classList.toggle("hidden",newMode !== "login");

    $("loginTab").classList.toggle("active",newMode === "login");
    $("signupTab").classList.toggle("active",newMode === "signup");

    $("password").autocomplete = newMode === "login" ? "current-password" : "new-password";

    $("heading").textContent = newMode === "login" ? "Welcome back" : "Create your account";
    $("description").textContent = newMode === "login"
        ? "Sign in to continue to your NOVEX workspace."
        : "Join NOVEX and explore your digital universe.";

    $("submitButton").textContent = newMode === "login" ? "Login to NOVEX" : "Create NOVEX Account";
}

$("loginTab").addEventListener("click",()=>setMode("login"));
$("signupTab").addEventListener("click",()=>setMode("signup"));

$("showPassword").addEventListener("click",function(){
    const field = $("password");
    field.type = field.type === "password" ? "text" : "password";
    this.textContent = field.type === "password" ? "Show" : "Hide";
});

$("authForm").addEventListener("submit",async event=>{
    event.preventDefault();
    hideMessage();

    if(!client){
        showMessage("Supabase is unavailable. Please check your connection and configuration.",true);
        return;
    }

    const email = $("email").value.trim();
    const password = $("password").value;
    const name = $("name").value.trim();

    if(password.length < 8){
        showMessage("Password must contain at least 8 characters.",true);
        return;
    }

    if(recoveryMode){
        if(password !== $("confirmPassword").value){
            showMessage("Your passwords do not match.",true);
            return;
        }

        setLoading(true,"Update Password");

        try{
            const {error} = await client.auth.updateUser({password});
            if(error) throw error;

            showMessage("Password updated successfully. You can now log in.");
            setMode("login");
        }catch(error){
            showMessage(error.message,true);
        }

        setLoading(false,"Update Password");
        return;
    }

    setLoading(true,"Please wait...");

    try{
        if(mode === "signup"){
            if(!name) throw new Error("Please enter your full name.");

            if(password !== $("confirmPassword").value){
                throw new Error("Your passwords do not match.");
            }

            const {data,error} = await client.auth.signUp({
                email,
                password,
                options:{
                    data:{full_name:name},
                    emailRedirectTo:location.origin + "/auth.html"
                }
            });

            if(error) throw error;

            if(data.session){
                location.href = "dashboard.html";
            }else{
                showMessage("Account created! Check your email and confirm your account before logging in.");
            }

        }else{
            const {data,error} = await client.auth.signInWithPassword({
                email,
                password
            });

            if(error) throw error;

            showMessage("Login successful! Welcome to NOVEX.");
            location.href = "dashboard.html";
        }

    }catch(error){
        showMessage(error.message || "Something went wrong.",true);
    }

    setLoading(false,mode === "login" ? "Login to NOVEX" : "Create NOVEX Account");
});

$("forgotButton").addEventListener("click",async()=>{
    hideMessage();

    if(!client){
        showMessage("Supabase connection unavailable.",true);
        return;
    }

    const email = $("email").value.trim();

    if(!email){
        showMessage("Enter your email address first.",true);
        return;
    }

    try{
        const {error} = await client.auth.resetPasswordForEmail(email,{
            redirectTo:location.origin + "/auth.html"
        });

        if(error) throw error;

        showMessage("If an account exists, a password reset link has been sent.");
    }catch(error){
        showMessage(error.message,true);
    }
});

$("returnButton").addEventListener("click",()=>setMode("login"));

if(!client){
    showMessage("Supabase client unavailable. Check the library and configuration.",true);
}else{
    client.auth.onAuthStateChange((event)=>{
        if(event === "PASSWORD_RECOVERY"){
            recoveryMode = true;
            mode = "recovery";

            $("tabs").classList.add("hidden");
            $("nameGroup").classList.add("hidden");
            $("forgot").classList.add("hidden");
            $("confirmGroup").classList.remove("hidden");
            $("backToLogin").classList.remove("hidden");

            $("heading").textContent = "Reset your password";
            $("description").textContent = "Choose a new password for your NOVEX account.";
            $("submitButton").textContent = "Update Password";

            showMessage("Enter your new password below.");
        }
    });

    client.auth.getSession().then(({data,error})=>{
        if(!error && data.session && !recoveryMode){
            location.href = "dashboard.html";
        }
    });
}
</script>
</body>
</html>
